# hyperv-csi
#
# Scoped to what the driver implements and the upstream external-storage e2e
# suite exercises against a real Hyper-V failover cluster: provisioning,
# reclaim (delete and retain), attach/detach, the full mount path, online
# expansion, and single-volume snapshots — CreateSnapshot, DeleteSnapshot,
# ListSnapshots, and restore through CreateVolume's VolumeContentSource. See
# testing.md.
#
# external-snapshotter and node fencing are defaulted off, but not because
# they are unproven — each has a cluster-side prerequisite this chart cannot
# supply (the snapshot CRDs + snapshot-controller; real host fencing under the
# failover cluster). Group snapshots, snapshot metadata, and volume cloning
# are not implemented.

image:
  repository: ghcr.io/charlespick/hyperv-csi-driver
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

logging:
  # klog -v level for the hyperv-csi-driver container, controller and node
  # alike. 0 = warnings/errors only. 1 = + driver lifecycle (start/stop,
  # node identity resolution). 2 = + RPC call lifecycle: method, key
  # identifiers, outcome (default). 4 = + full request objects and every
  # HTTP call to the agent. 5 = + per-poll-iteration and lock-contention
  # detail.
  verbosity: 2

# The hyperv-csi-agent running as a clustered role on the Hyper-V failover
# cluster. Must be https:// — the driver refuses a plaintext address whenever a
# client certificate is configured, since over plaintext the certificate proves
# nothing.
agent:
  address: ""

  # Development escape hatch. Drops TLS and the client certificate entirely,
  # which is what stands between the agent's job API and anything that can route
  # to it. The agent only serves such callers when it is itself running in
  # Development.
  allowInsecure: false

  # SHA-1 thumbprints of the agent's own server certificate, which is
  # self-signed - there is no CA on either side of this connection, so the
  # driver pins it by fingerprint the same way the agent pins the driver's
  # client certificate, rather than validating a trust chain that doesn't
  # exist. List two during a rotation: add the new certificate's thumbprint,
  # roll the agent onto it, then remove the old one. Required whenever
  # allowInsecure is false.
  serverCertificateThumbprints: []

# The self-signed client certificate the agent pins by fingerprint. Create it
# with the commands in the repository README, and put its fingerprint in the
# agent's own config file — the agent will reject anything else at the TLS
# handshake.
clientCertificate:
  # Preferred: a kubernetes.io/tls Secret you created yourself, so the private
  # key never passes through Helm values or release history.
  #   kubectl create secret tls hyperv-csi-agent-client --cert=tls.crt --key=tls.key
  existingSecret: "hyperv-csi-agent-client"

  # Alternative: have the chart create the Secret. Supply these with
  # --set-file rather than writing a private key into a values file.
  cert: ""
  key: ""

controller:
  replicaCount: 1

  # external-provisioner, external-attacher and external-resizer are the
  # sidecars deployed unconditionally; external-snapshotter, below, is the one
  # that is opt-in. Each --timeout bounds how long the sidecar waits for one
  # call; the driver clamps its own job polling to a fraction of whatever
  # deadline arrives, so these stay consistent automatically.
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    timeout: 30s
    extraArgs: []

  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.7.0
    timeout: 30s
    extraArgs: []

  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    # Longer than the other two: growing a VHDX is the one controller operation
    # whose work scales with the disk, and the agent's own budget for it is
    # DiskOperationTimeout.
    timeout: 60s
    extraArgs: []

  # livenessprobe exposes the driver's CSI Probe RPC as an HTTP /healthz on
  # port 9808 for a kubelet livenessProbe — the driver binary serves no HTTP
  # itself. Pinned to the same sidecar release wave as the three above.
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0

  # external-snapshotter. Off by default — not because the snapshot path is
  # unproven (CreateSnapshot, DeleteSnapshot, ListSnapshots and
  # restore-from-snapshot through CreateVolume's VolumeContentSource are all
  # exercised by the upstream snapshottable e2e suite against a real cluster;
  # see testing.md) but because the sidecar is inert without two things this
  # chart does not install: the snapshot.storage.k8s.io CRDs and the
  # cluster-wide snapshot-controller. Both ship with external-snapshotter and
  # are shared by every CSI driver on the cluster, so a per-driver chart
  # installing them would fight whichever driver got there first. Without them
  # the sidecar starts and finds nothing to watch, and the VolumeSnapshotClass
  # this chart renders fails to apply for want of its CRD. Enable this once
  # those are present.
  #
  # Group snapshots and snapshot metadata are a separate matter — not
  # implemented, so nothing here reaches them.
  #
  # A snapshot freezes the whole VM its source volume is attached to for the
  # duration of the copy behind it — see README.md's "Snapshot storage
  # requirements". Use ReFS for the CSV, or expect CreateSnapshot to spend a
  # long time returning ABORTED for every volume on a node queued behind
  # another volume's copy.
  snapshotter:
    enabled: false

    # Newer than the other three sidecars, which are all pinned to the same
    # older release wave. Sidecars version independently — each one speaks CSI
    # to the driver and the Kubernetes API to the cluster, not to each other —
    # and there is no reason to introduce a new one at a release upstream no
    # longer supports.
    image: registry.k8s.io/sig-storage/csi-snapshotter:v8.6.0

    # Bounds CreateSnapshot and DeleteSnapshot the same way the sidecars above
    # bound theirs. 30s matches the provisioner and attacher rather than the
    # resizer: a Hyper-V checkpoint is a metadata operation whose cost does not
    # scale with the size of the disk, so it has no reason to need the longer
    # budget an expansion does.
    #
    # Tuned as a pair with the agent's SnapshotCheckpointWaitTimeout, which is
    # kept deliberately shorter than this so a caller waiting on a busy VM
    # gets the agent's own explanation rather than a generic sidecar timeout.
    # Neither side can discover the other's value — change one, check the
    # other.
    timeout: 30s
    extraArgs: []

  # Node fencing. Off by default, and this is the one switch in this chart that
  # grants the driver a write over an object outside storage: when a node stops
  # being reachable and the Hyper-V cluster confirms its VM is not running
  # anywhere, the driver applies node.kubernetes.io/out-of-service to the Node.
  # That taint is what lets Kubernetes force-delete pods stranded on a dead node
  # and detach their volumes — without it a pod sits Terminating forever,
  # because the kubelet that would confirm teardown is on the node that died,
  # and a StatefulSet never gets its replacement for that ordinal.
  #
  # What the decision rests on is worth understanding before turning this on.
  # The confirmation comes from Windows Failover Clustering's own quorum-backed
  # answer that the VM's cluster resource is not online on any node. That is
  # cluster *consensus*, not a hardware guarantee: quorum reliably decides who
  # is *allowed* to run the VM, but whether a partitioned host actually stopped
  # executing depends on real fencing underneath — BMC/iDRAC/iLO power fencing,
  # or Storage Spaces Direct's poison-pill self-fencing. With that underneath,
  # "the cluster says nobody owns it" is a strong signal; without it, it is an
  # assumption, and the cost of it being wrong is the double-mount this whole
  # design exists to avoid.
  #
  # Enabling this also grants the driver's ClusterRole get/list/watch/update on
  # nodes, which is a new privilege category for this chart — see rbac.yaml.
  #
  # The taint is applied and never removed. Clearing it is a manual step during
  # node recovery (kubectl taint nodes <node> node.kubernetes.io/out-of-service-)
  # and a recovered, healthy node stays out-of-service until someone does.
  nodeFencing:
    enabled: false

    # How long a node must hold the unreachable:NoExecute taint before the
    # driver starts asking the cluster about it at all. This is the window for
    # ordinary disruption to resolve itself — a brief network partition, a
    # kubelet restart, a node rebooting — without anything being fenced.
    gracePeriod: 2m

    # How often the cluster is asked about a node past its grace period. Each
    # poll is one keyed WQL query against the local cluster database mirror,
    # measured in single-digit milliseconds and answered without contacting the
    # owning host, so this is cheap; it is kept modest because nothing here is
    # urgent enough to be worth a tighter loop.
    pollInterval: 30s

    # How many consecutive confirmations are required before the taint is
    # applied. This is not belt-and-braces — it is load-bearing. A genuinely
    # broken VM does not settle: with the cluster's own restart policy retrying
    # it, the resource cycles Failed -> OnlinePending -> OfflinePending ->
    # Failed for minutes on end, and a healthy VM reads Offline for a fraction
    # of a second in the middle of an ordinary live migration. The streak is
    # state-gated, not merely time-gated: only a terminal reading advances it,
    # and any other reading — a pending state, an unrecognised one, or an error
    # asking at all — resets it to zero. So this many confirmations means this
    # many *uninterrupted* ones, and raising it buys certainty at the cost of
    # confirmations * pollInterval extra delay before a genuinely dead node is
    # released.
    confirmations: 5

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  # A built-in PriorityClass present on every cluster (value 2000000000).
  # Losing the controller halts provisioning, attach/detach and resize for
  # every managed volume, so it should outrank ordinary workloads when kubelet
  # is choosing what to evict. Set to "" to opt out. A ResourceQuota with a
  # priorityClass scopeSelector in this namespace can forbid the name, in which
  # case override it with one you are allowed to use.
  priorityClassName: system-cluster-critical

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The node plugin stages and mounts volumes in the guest. Every Node* RPC is
# now built, so a pod using a PVC runs the whole path: a real attach
# (VolumeAttachment, ControllerPublishVolume, a disk appearing in the VM's
# configuration), a real NodeStageVolume format-and-mount, and a real
# NodePublishVolume bind-mount into the pod — and unwinds it again on teardown.
#
# Keep it on even if that were not true, because attach needs it for a reason
# unrelated to mounting: the node plugin's registration is what creates the
# CSINode object, and CSINode is where external-attacher reads the CSI node ID
# it passes to ControllerPublishVolume. Without it there is no node ID to
# resolve and no attach can complete, whatever attachRequired says.
#
# Two things the guest must have, and the plugin refuses to start without them
# rather than falling back to its hostname: the hyperv-daemons package with
# hv_kvp_daemon running, and the Data Exchange integration service enabled on
# the VM. That is where the Hyper-V VM ID it reports as the CSI node ID comes
# from.
node:
  enabled: true

  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0

  # livenessprobe exposes the driver's CSI Probe RPC as an HTTP /healthz on
  # port 9808 for a kubelet livenessProbe — the driver binary serves no HTTP
  # itself. Pinned to the same sidecar release wave as the registrar above.
  livenessProbe:
    image: registry.k8s.io/sig-storage/livenessprobe:v2.14.0

  kubeletDir: /var/lib/kubelet

  # Where hv_kvp_daemon keeps the Hyper-V key-value pools. The node plugin reads
  # its own VM ID from these and reports it as the CSI node ID, which is what
  # lets the agent resolve a node to a VM by identity instead of by name. Every
  # node therefore needs the hyperv-daemons package installed and the Data
  # Exchange integration service enabled on its VM; without them the pools are
  # absent and the node plugin refuses to start.
  kvpPoolDir: /var/lib/hyperv

  # Migration escape hatch for upgrading from a release candidate installed
  # before NodeStageVolume verified the resolved disk's own identity (see
  # PR #33 and its review comments, github issue #30): a PV created back then
  # has no diskId in its volume_context, and kubelet replays that same,
  # disk-ID-less context on every restage, so by default such a PV now fails
  # NodeStageVolume with InvalidArgument.
  #
  # Setting this to true is an explicit acknowledgment that some PVs on this
  # cluster predate the disk ID check: NodeStageVolume then falls back to
  # trusting vmbusdisk.Resolve's controller/LUN slot alone for a volume whose
  # volume_context has no diskId - the same, slightly less safe mode this
  # driver ran in before the check existed, and no safer than a coordinate
  # ever was. A PV whose volume_context does carry a diskId is still verified
  # against it either way; this only relaxes the requirement that the field
  # be present at all. Recreate every affected PV against a volume_context
  # that carries a diskId, then turn this back off.
  unsafeAllowMissingDiskId: false

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  # A built-in PriorityClass present on every cluster (value 2000001000). If
  # kubelet evicts the node plugin under resource pressure, no pod on that node
  # can stage, mount or unmount one of this driver's volumes, so it ranks with
  # the other node-critical infrastructure DaemonSets. Set to "" to opt out;
  # override if a ResourceQuota in this namespace forbids the name.
  priorityClassName: system-node-critical

  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  podAnnotations: {}

# StorageClasses for this driver. Each list entry renders one StorageClass
# whose provisioner is fixed to the driver name; set the list to [] to have the
# chart create none. The common shape is two classes:
#
#   - a Retain class for volumes whose data should outlive their PVC, and
#   - a Delete class for disposable ones — CI scratch space, or the
#     clone-and-copy PVCs a backup tool (Kasten, Velero, ...) provisions per
#     export from a snapshot and then deletes. On a Retain class that leaks a
#     Released PV and its VHDX every run.
#
# Per-entry fields and their defaults:
#   name                  (required)
#   isDefault             false  — storageclass.kubernetes.io/is-default-class.
#                                  At most one class on the cluster, from any
#                                  provisioner, may set it.
#   reclaimPolicy         Retain — Retain or Delete. Delete runs DeleteVolume
#                                  when the PVC is removed and the VHDX on the
#                                  CSV goes with it. The whole provision->delete
#                                  lifecycle, this included, is covered by the
#                                  upstream external-storage e2e suite against a
#                                  real failover cluster (testing.md).
#   volumeBindingMode     Immediate — a VHDX on the CSV is reachable from every
#                                  node, so there is no placement decision to
#                                  defer with WaitForFirstConsumer; deferring
#                                  would only hold the PVC Pending.
#   allowVolumeExpansion  true   — ControllerExpandVolume + NodeExpandVolume,
#                                  online, exercised against a running VM.
#   annotations           {}     — extra StorageClass annotations.
#   parameters            {}     — StorageClass.parameters for CreateVolume;
#                                  none are required today.
#
# The first class here defaults to Retain not because Delete is unproven, but
# because a cluster-wide default class that deletes the backing disk the moment
# a PVC is removed is the wrong default for volumes that hold data. Add a
# Delete-reclaim class alongside it for the disposable case.
storageClasses:
  - name: hyperv-csi
    isDefault: false
    reclaimPolicy: Retain
    volumeBindingMode: Immediate
    allowVolumeExpansion: true
    annotations: {}
    parameters: {}

  # - name: hyperv-csi-delete
  #   isDefault: false
  #   reclaimPolicy: Delete
  #   volumeBindingMode: Immediate
  #   allowVolumeExpansion: true
  #   annotations: {}
  #   parameters: {}

# The VolumeSnapshotClass that points VolumeSnapshots at this driver. Rendered
# only when controller.snapshotter.enabled is set — the class is inert without
# the sidecar, and its CRD is not installed on a cluster that has never had
# external-snapshotter on it, so creating it unconditionally would fail the
# install for everyone who does not want snapshots.
volumeSnapshotClass:
  name: hyperv-csi

  # Free-form, e.g. for the third-party backup tools that discover a driver's
  # VolumeSnapshotClass by annotation rather than by convention.
  annotations: {}

  # Delete: deleting a VolumeSnapshot calls DeleteSnapshot and removes the
  # snapshot on the Hyper-V side for real (exercised by the snapshottable e2e
  # suite, same as the rest of the snapshot path). Defaults to Delete rather
  # than Retain because a retained snapshot leaves both a VolumeSnapshotContent
  # object and its on-cluster snapshot behind with nothing referencing them,
  # accumulating invisibly rather than as a leftover PV somebody notices.
  deletionPolicy: Delete

rbac:
  create: true

serviceAccount:
  create: true
  # Defaults to the fullname.
  name: ""
  annotations: {}

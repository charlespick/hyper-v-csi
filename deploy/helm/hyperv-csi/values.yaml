# hyperv-csi
#
# Scoped to what the driver actually implements today: provisioning, reclaim,
# attach/detach, the full mount path, and expansion. Snapshotting is still
# Unimplemented, so the chart deliberately does not deploy external-snapshotter
# — it would sit in a retry loop against RPCs that cannot succeed. The knobs to
# turn that on will go here, defaulted off, when those RPCs land.
#
# Implemented is not the same as exercised. Only provisioning, reclaim,
# attach/detach and staging have run against a real Hyper-V cluster; see the
# Status column in CSI Spec.md, and the individual defaults below that stay
# conservative because of it.

image:
  repository: ghcr.io/charlespick/hyperv-csi-driver
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# The hyperv-csi-agent running as a clustered role on the Hyper-V failover
# cluster. Must be https:// — the driver refuses a plaintext address whenever a
# client certificate is configured, since over plaintext the certificate proves
# nothing.
agent:
  address: ""

  # Development escape hatch. Drops TLS and the client certificate entirely,
  # which is what stands between the agent's job API and anything that can route
  # to it. The agent only serves such callers when it is itself running in
  # Development.
  allowInsecure: false

  # SHA-1 thumbprints of the agent's own server certificate, which is
  # self-signed - there is no CA on either side of this connection, so the
  # driver pins it by fingerprint the same way the agent pins the driver's
  # client certificate, rather than validating a trust chain that doesn't
  # exist. List two during a rotation: add the new certificate's thumbprint,
  # roll the agent onto it, then remove the old one. Required whenever
  # allowInsecure is false.
  serverCertificateThumbprints: []

  # Testing escape hatch: the agent's HostFiltering only accepts a Host header
  # matching Tls:HostName, so agent.address has to name that DNS name -
  # addressing the agent by bare IP gets "400 Bad Request - Invalid Hostname"
  # from Kestrel. A real deployment resolves that name through real DNS; this
  # is for pointing it at a host with none, via the pod's /etc/hosts. Standard
  # Pod.spec.hostAliases shape - see the Kubernetes docs. Empty by default.
  hostAliases: []

# The self-signed client certificate the agent pins by fingerprint. Create it
# with the commands in the repository README, and put its fingerprint in the
# agent's own config file — the agent will reject anything else at the TLS
# handshake.
clientCertificate:
  # Preferred: a kubernetes.io/tls Secret you created yourself, so the private
  # key never passes through Helm values or release history.
  #   kubectl create secret tls hyperv-csi-agent-client --cert=tls.crt --key=tls.key
  existingSecret: "hyperv-csi-agent-client"

  # Alternative: have the chart create the Secret. Supply these with
  # --set-file rather than writing a private key into a values file.
  cert: ""
  key: ""

controller:
  replicaCount: 1

  # external-provisioner, external-attacher and external-resizer are the
  # sidecars whose RPCs exist. Each --timeout bounds how long the sidecar waits
  # for one call; the driver clamps its own job polling to a fraction of
  # whatever deadline arrives, so these stay consistent automatically.
  provisioner:
    image: registry.k8s.io/sig-storage/csi-provisioner:v5.1.0
    timeout: 30s
    extraArgs: []

  attacher:
    image: registry.k8s.io/sig-storage/csi-attacher:v4.7.0
    timeout: 30s
    extraArgs: []

  resizer:
    image: registry.k8s.io/sig-storage/csi-resizer:v1.12.0
    # Longer than the other two: growing a VHDX is the one controller operation
    # whose work scales with the disk, and the agent's own budget for it is
    # DiskOperationTimeout.
    timeout: 60s
    extraArgs: []

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

# The node plugin stages and mounts volumes in the guest. Every Node* RPC is
# now built, so a pod using a PVC runs the whole path: a real attach
# (VolumeAttachment, ControllerPublishVolume, a disk appearing in the VM's
# configuration), a real NodeStageVolume format-and-mount, and a real
# NodePublishVolume bind-mount into the pod — and unwinds it again on teardown.
#
# Keep it on even if that were not true, because attach needs it for a reason
# unrelated to mounting: the node plugin's registration is what creates the
# CSINode object, and CSINode is where external-attacher reads the CSI node ID
# it passes to ControllerPublishVolume. Without it there is no node ID to
# resolve and no attach can complete, whatever attachRequired says.
#
# Two things the guest must have, and the plugin refuses to start without them
# rather than falling back to its hostname: the hyperv-daemons package with
# hv_kvp_daemon running, and the Data Exchange integration service enabled on
# the VM. That is where the Hyper-V VM ID it reports as the CSI node ID comes
# from.
node:
  enabled: true

  registrar:
    image: registry.k8s.io/sig-storage/csi-node-driver-registrar:v2.12.0

  kubeletDir: /var/lib/kubelet

  # Where hv_kvp_daemon keeps the Hyper-V key-value pools. The node plugin reads
  # its own VM ID from these and reports it as the CSI node ID, which is what
  # lets the agent resolve a node to a VM by identity instead of by name. Every
  # node therefore needs the hyperv-daemons package installed and the Data
  # Exchange integration service enabled on its VM; without them the pools are
  # absent and the node plugin refuses to start.
  kvpPoolDir: /var/lib/hyperv

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  podAnnotations: {}

storageClass:
  create: true
  name: hyperv-csi
  isDefault: false

  # Retain, not Delete. DeleteVolume is implemented now, so Delete would work —
  # but it has not yet run against a real Hyper-V host, and under Delete the
  # first time it ever does would be an irreversible disk deletion triggered by
  # someone removing a PVC. Retain never calls it, so the VHDX outlives the PV
  # and is removed by hand. Switch this to Delete once you have watched a
  # DeleteVolume succeed on your cluster.
  reclaimPolicy: Retain

  # WaitForFirstConsumer exists to let a topology-aware driver place the volume
  # where the pod landed. This one advertises no topology at all — a VHDX on the
  # CSV is reachable from every node in the failover cluster, and see CSI
  # Spec.md on why VOLUME_ACCESSIBILITY_CONSTRAINTS is deliberately omitted — so
  # deferring the bind would buy nothing and only hold the PVC Pending until
  # something scheduled against it.
  volumeBindingMode: Immediate

  # Both halves of an expansion exist now — ControllerExpandVolume grows the
  # VHDX, NodeExpandVolume grows the filesystem in it — so editing a PVC's
  # request is accepted rather than silently rejected by the API server. Both
  # have run against a real cluster, including a volume attached to a running
  # VM, and the guest filesystem growing online with no pod restart.
  allowVolumeExpansion: true
  parameters: {}

rbac:
  create: true

serviceAccount:
  create: true
  # Defaults to the fullname.
  name: ""
  annotations: {}

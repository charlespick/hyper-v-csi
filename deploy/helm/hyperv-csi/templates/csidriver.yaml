{{- include "hyperv-csi.validate" . -}}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Must equal the DriverName compiled into the binary and the provisioner of
  # every StorageClass below.
  name: {{ include "hyperv-csi.driverName" . }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
spec:
  # Both halves of publish/unpublish are implemented and external-attacher is
  # deployed, so Kubernetes creates a VolumeAttachment before a volume's first
  # use and clears it before the PV can be deleted. DeleteVolume relies on that
  # ordering — it does not re-check that a volume is detached — so this flag and
  # the attacher in controller.yaml have to stay together.
  attachRequired: true

  # NodePublishVolume receives no pod metadata; nothing consumes it yet.
  podInfoOnMount: false

  storageCapacity: false

  volumeLifecycleModes:
    - Persistent

  fsGroupPolicy: File

{{- include "hyperv-csi.validate" . -}}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  # Must equal the DriverName compiled into the binary and the provisioner of
  # every StorageClass below.
  name: {{ include "hyperv-csi.driverName" . }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
spec:
  # ControllerPublishVolume is implemented, so Kubernetes creates a
  # VolumeAttachment and calls it before a volume is first used.
  #
  # Two things this turns on are still unbuilt, and both matter before running
  # this anywhere real. ControllerUnpublishVolume returns Unimplemented, so a
  # volume that attaches never detaches — and DeleteVolume deletes on the
  # assumption that Unpublish already ran, which now means a reclaim can remove
  # a disk still attached to a VM. The external-attacher sidecar is also not
  # deployed (see controller.yaml), so nothing acts on the VolumeAttachment
  # objects this causes to be created.
  attachRequired: true

  # NodePublishVolume receives no pod metadata; nothing consumes it yet.
  podInfoOnMount: false

  storageCapacity: false

  volumeLifecycleModes:
    - Persistent

  fsGroupPolicy: File

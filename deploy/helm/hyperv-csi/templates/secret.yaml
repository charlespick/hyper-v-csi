{{- if and (not .Values.clientCertificate.existingSecret) .Values.clientCertificate.cert .Values.clientCertificate.key }}
# Only rendered when the certificate is supplied through values. Prefer
# clientCertificate.existingSecret: a key passed through Helm values is also in
# the release history, which is stored in the cluster.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperv-csi.clientCertificateSecret" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.clientCertificate.cert | b64enc }}
  tls.key: {{ .Values.clientCertificate.key | b64enc }}
{{- end }}

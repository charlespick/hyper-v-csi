{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hyperv-csi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Scoped to what the driver container itself needs, independent of any
# sidecar: ControllerExpandVolume looks up which node (if any) currently has
# a volume attached, since CSI's own request carries no node ID the way
# ControllerPublishVolume/UnpublishVolume's does. The VolumeAttachment read is
# the same one external-attacher makes to find a volume's node, and the
# CSINode read is the same one it makes to turn that node into this driver's
# own node ID - both already permitted by the attacher role below, but
# declared again here because this need is the driver's own and does not
# depend on external-attacher being deployed.
#
# Node fencing, when enabled, adds something of a different kind to this role.
# The two rules above are reads of storage objects; the nodes rule below is a
# write onto a core object outside storage, and its effect is to make
# Kubernetes force-delete pods and detach their disks. It is rendered only when
# controller.nodeFencing.enabled is set, for the same reason the snapshotter
# role below is conditional — an install that has not opted in should not be
# carrying a standing grant to write to every Node in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-driver
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch"]
  # Also how node fencing turns a tainted node into this driver's VM ID, so it
  # needs nothing added when fencing is on.
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.controller.nodeFencing.enabled }}
  # get/list/watch feed the Node informer that spots the unreachable:NoExecute
  # taint. update is what writes node.kubernetes.io/out-of-service back.
  #
  # It has to be update, not patch, and this is not the usual "we were lazy"
  # case — do not tighten it. NodeSpec.Taints is +listType=atomic with no
  # patchStrategy and no patchMergeKey, so a strategic-merge patch against it
  # does not merge, it replaces the whole list. A patch built from a node read
  # a moment earlier would silently delete any taint another controller added
  # in between: an autoscaler's NoSchedule, a kubelet pressure taint, an
  # operator's drain marker. The driver therefore applies the taint with a
  # read-append-update under retry.RetryOnConflict, whose failure mode is the
  # benign one — a conflict re-reads and lands the append on top of the other
  # writer's version, so both taints survive. See applyOutOfServiceTaint in
  # csi-driver/internal/nodefencing/taint.go.
  #
  # No nodes/status: taints live in spec, not status.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "update"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-driver
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-driver
  apiGroup: rbac.authorization.k8s.io
---
# Scoped to what external-provisioner actually needs. Resize has its own role
# below. The snapshot reads at the end are what restore-from-snapshot costs the
# provisioner — given a PVC with a VolumeSnapshot dataSource it reads the
# snapshot and then its VolumeSnapshotContent to find the snapshot handle to
# pass as CreateVolume's VolumeContentSource — so they are tied to the same
# controller.snapshotter.enabled switch as the sidecar itself and are absent
# when it is off. They are reads only; nothing here writes a snapshot object.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  {{- if .Values.controller.snapshotter.enabled }}
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Scoped to what external-attacher needs. It watches VolumeAttachment objects
# and calls ControllerPublishVolume/ControllerUnpublishVolume for them, so the
# PV read is how it learns the volume handle and the CSINode read is how it
# turns a Kubernetes node name into the CSI node ID this driver resolves.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-attacher
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["volumeattachments/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-attacher
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-attacher
  apiGroup: rbac.authorization.k8s.io
---
# Scoped to what external-resizer needs. It watches PVCs whose request has grown
# past their status, calls ControllerExpandVolume, and writes the new capacity
# back — hence the claim status write, which is the one permission the
# provisioner's role does not already cover. The pods read is for the in-use
# check: an expansion of a mounted volume has to be followed by
# NodeExpandVolume, so the resizer has to know which pods are using the claim.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-resizer
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims/status"]
    verbs: ["patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-resizer
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-resizer
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.controller.snapshotter.enabled }}
---
# Scoped to what external-snapshotter needs, and rendered only when that
# sidecar is deployed — an unbound role granting rights over CRDs the cluster
# may not even have is noise on every install that hasn't opted in.
#
# Its work is on the content side of the snapshot split: the cluster-wide
# snapshot-controller (not deployed by this chart) turns a user's
# VolumeSnapshot into a VolumeSnapshotContent, and this sidecar is what turns
# that content object into a CreateSnapshot or DeleteSnapshot call and writes
# the result — handle, size, readiness — back onto it. Hence read on the class
# it resolves parameters from, read and write on contents and their status, and
# read on the VolumeSnapshot the content is bound to.
#
# Nothing here mentions groupsnapshot.storage.k8s.io: upstream's own role
# covers VolumeGroupSnapshots too, but the driver has no GET_VOLUME_GROUP_SNAPSHOT
# capability, so those rules would grant rights over an API this driver can
# never serve.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-snapshotter
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotcontents/status"]
    verbs: ["update", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots/status"]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-snapshotter
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-snapshotter
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Leader election, shared by every sidecar, so scaling the controller past one
# replica doesn't mean two provisioners racing on the same PVC, two attachers
# on the same VolumeAttachment, two resizers on the same expansion, or — when
# external-snapshotter is enabled — two snapshotters on the same
# VolumeSnapshotContent. Every sidecar runs with the same ServiceAccount, so
# the snapshotter is covered by this binding as soon as it is deployed; there
# is nothing to switch on here.
#
# The driver container elects here too when node fencing is enabled, on its own
# lease (controller.nodeFencing, and --node-fencing-lease-name to rename it).
# get/create/update are what client-go's Lease resourcelock actually calls, and
# they are already granted above, so that switch needs nothing added here
# either.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  apiGroup: rbac.authorization.k8s.io
{{- end }}

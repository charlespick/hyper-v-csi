{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hyperv-csi.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Scoped to what external-provisioner actually needs. Attachment, resize, and
# snapshot permissions are deliberately absent: those sidecars aren't deployed,
# because the RPCs behind them aren't implemented.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch", "create", "update", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "hyperv-csi.fullname" . }}-provisioner
  apiGroup: rbac.authorization.k8s.io
---
# Leader election, so scaling the controller past one replica doesn't mean two
# provisioners racing on the same PVC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "hyperv-csi.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "hyperv-csi.fullname" . }}-leader-election
  apiGroup: rbac.authorization.k8s.io
{{- end }}

{{- if .Values.controller.snapshotter.enabled }}
# Gated on the sidecar rather than on a create flag of its own. Two reasons:
# without external-snapshotter nothing ever acts on a VolumeSnapshot pointed at
# this class, and on a cluster that has never run external-snapshotter the
# snapshot.storage.k8s.io CRDs do not exist at all — so an unconditional
# VolumeSnapshotClass would fail `helm install` with "no matches for kind"
# for every user who does not want snapshots.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: {{ .Values.volumeSnapshotClass.name }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
  {{- with .Values.volumeSnapshotClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
driver: {{ include "hyperv-csi.driverName" . }}
# Delete by default: removing a VolumeSnapshot removes the snapshot on the
# Hyper-V side for real, through DeleteSnapshot. Retain keeps both the
# VolumeSnapshotContent and the underlying snapshot, at the cost of leaking
# both — see volumeSnapshotClass.deletionPolicy in values.yaml for why Delete
# is the default here.
deletionPolicy: {{ .Values.volumeSnapshotClass.deletionPolicy }}
{{- end }}

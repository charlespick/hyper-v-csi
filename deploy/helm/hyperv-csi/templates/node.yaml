{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "hyperv-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "hyperv-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hyperv-csi.serviceAccountName" . }}
      hostNetwork: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: {{ .Values.node.registrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: hyperv-csi-driver
          image: {{ include "hyperv-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            # No --node-id: the node identifies itself by its Hyper-V VM ID,
            # read from the key-value pools below. That is the value kubelet
            # records in CSINode and external-attacher hands to
            # ControllerPublishVolume, so the agent resolves a node to a VM by
            # identity rather than by matching names.
            - --endpoint=unix:///csi/csi.sock
            - --kvp-pool-dir=/var/lib/hyperv
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: pods-mount-dir
              mountPath: {{ .Values.node.kubeletDir }}/pods
              mountPropagation: Bidirectional
            # Read-only: the host publishes into these pools and the guest only
            # reads them. hv_kvp_daemon must be running on the node (the
            # hyperv-daemons package) or this directory is empty and the plugin
            # refuses to start rather than guessing at its own identity.
            - name: hyperv-kvp
              mountPath: /var/lib/hyperv
              readOnly: true
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            # Staging and publishing a volume means mounting inside the guest,
            # which needs privilege — but NodeStageVolume/NodePublishVolume are
            # still stubs, so nothing here does that work yet. Flip this back to
            # true (or to a narrower capability set, if one turns out to suffice)
            # when those RPCs actually mount.
            privileged: false
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        - name: pods-mount-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/pods
            type: Directory
        - name: hyperv-kvp
          hostPath:
            path: {{ .Values.node.kvpPoolDir }}
            # Directory, not DirectoryOrCreate: conjuring an empty one would
            # turn "integration services are not running" into a pod that starts
            # and then fails to find its VM ID, which is a longer path to the
            # same answer.
            type: Directory
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

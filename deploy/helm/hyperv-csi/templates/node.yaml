{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "hyperv-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "hyperv-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hyperv-csi.serviceAccountName" . }}
      {{- with .Values.node.priorityClassName }}
      # The node plugin is on the mount path of every pod with one of this
      # driver's volumes. If kubelet evicts it under resource pressure, those
      # pods cannot stage, mount or unmount — so it ranks alongside the other
      # node-critical infrastructure DaemonSets.
      priorityClassName: {{ . }}
      {{- end }}
      hostNetwork: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Waits until the controller has recorded this node's Hyper-V VM ID on
      # its Node object - discovered from the node's SMBIOS UUID - and exits.
      # Normally seconds; as long as the controller or the agent is down
      # otherwise, and the pod reads Init:0/1 meanwhile.
      #
      # An init container rather than a wait inside the plugin, so nothing
      # else in the pod starts until the plugin can say who it is:
      # node-driver-registrar gives up on a CSI socket that has not appeared
      # within a fixed 30 seconds, and would crash-loop through a longer wait
      # and then sit out its backoff after the identity arrived. Init
      # containers are not liveness-probed, so the wait needs no probe tuning
      # either.
      initContainers:
        - name: node-identity
          image: {{ include "hyperv-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node-identity
            - --v={{ .Values.logging.verbosity }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Reads /sys/class/dmi/id/product_uuid (root-owned, mode 0400 - root
          # in the container reads it as its owner, no capability needed) and
          # the Node object. Nothing else.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: node-driver-registrar
          image: {{ .Values.node.registrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        # Turns the driver's CSI Probe RPC into an HTTP /healthz kubelet can
        # poll — the driver process has no HTTP surface of its own. Without it a
        # node plugin whose gRPC server has wedged stays registered and nothing
        # restarts it, so pods scheduled to this node hang in staging.
        - name: liveness-probe
          image: {{ .Values.node.livenessProbe.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

        - name: hyperv-csi-driver
          image: {{ include "hyperv-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            # No --node-id: the node identifies itself by its Hyper-V VM ID,
            # which the controller discovers from the node's SMBIOS UUID and
            # records on its Node object. The init container above waits for
            # that record; this re-checks it against its own
            # /sys/class/dmi/id/product_uuid, and reports the VM ID - the value
            # kubelet records in CSINode and
            # external-attacher hands to ControllerPublishVolume, so the agent
            # resolves a node to a VM by identity rather than by matching names.
            - --endpoint=unix:///csi/csi.sock
            - --v={{ .Values.logging.verbosity }}
            {{- if .Values.node.unsafeAllowMissingDiskId }}
            # See node.unsafeAllowMissingDiskId in values.yaml - a migration
            # escape hatch, not meant to stay on.
            - --allow-missing-disk-id
            {{- end }}
          env:
            # Which Node object to read the recorded VM ID from.
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # Bidirectional: NodeStageVolume mounts under
            # kubeletDir/plugins/kubernetes.io/csi/<driver>/<volume>/globalmount,
            # a path kubelet computes and this container does not otherwise
            # have visibility into. Mounting the whole kubeletDir at the same
            # path it has on the host, with propagation back out, is what
            # lets a mount made in here show up in the host's mount table —
            # which is how kubelet itself finds out the volume is staged.
            # Requires privileged: true below; Kubernetes rejects
            # Bidirectional otherwise.
            - name: kubelet-dir
              mountPath: {{ .Values.node.kubeletDir }}
              mountPropagation: Bidirectional
            # vmbusdisk.Resolve finds the disk under /sys, but the block
            # device node it resolves to (e.g. /dev/sda) lives in /dev, and a
            # container's own /dev is a private, minimal one that does not
            # include host block devices without this.
            - name: device-dir
              mountPath: /dev
          # Served by the liveness-probe sidecar above, which shares this pod's
          # network namespace; named here so the probe below can reference it.
          ports:
            - name: healthz
              containerPort: 9808
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            # NodeStageVolume/NodeUnstageVolume actually mount and unmount
            # now (format included), which needs CAP_SYS_ADMIN, and is also
            # what Kubernetes requires to honor the kubelet-dir mount's
            # mountPropagation: Bidirectional above.
            privileged: true
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

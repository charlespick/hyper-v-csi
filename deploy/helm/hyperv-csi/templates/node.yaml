{{- if .Values.node.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "hyperv-csi.fullname" . }}-node
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperv-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
spec:
  selector:
    matchLabels:
      {{- include "hyperv-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node
  template:
    metadata:
      labels:
        {{- include "hyperv-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node
      {{- with .Values.node.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hyperv-csi.serviceAccountName" . }}
      hostNetwork: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: node-driver-registrar
          image: {{ .Values.node.registrar.image }}
          args:
            - --csi-address=/csi/csi.sock
            - --kubelet-registration-path={{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            - name: registration-dir
              mountPath: /registration
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: hyperv-csi-driver
          image: {{ include "hyperv-csi.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --mode=node
            # No --node-id: the node identifies itself by its Hyper-V VM ID,
            # read from the key-value pools below. That is the value kubelet
            # records in CSINode and external-attacher hands to
            # ControllerPublishVolume, so the agent resolves a node to a VM by
            # identity rather than by matching names.
            - --endpoint=unix:///csi/csi.sock
            - --kvp-pool-dir=/var/lib/hyperv
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            # Bidirectional: NodeStageVolume mounts under
            # kubeletDir/plugins/kubernetes.io/csi/<driver>/<volume>/globalmount,
            # a path kubelet computes and this container does not otherwise
            # have visibility into. Mounting the whole kubeletDir at the same
            # path it has on the host, with propagation back out, is what
            # lets a mount made in here show up in the host's mount table —
            # which is how kubelet itself finds out the volume is staged.
            # Requires privileged: true below; Kubernetes rejects
            # Bidirectional otherwise.
            - name: kubelet-dir
              mountPath: {{ .Values.node.kubeletDir }}
              mountPropagation: Bidirectional
            # vmbusdisk.Resolve finds the disk under /sys, but the block
            # device node it resolves to (e.g. /dev/sda) lives in /dev, and a
            # container's own /dev is a private, minimal one that does not
            # include host block devices without this.
            - name: device-dir
              mountPath: /dev
            # Read-only: the host publishes into these pools and the guest only
            # reads them. hv_kvp_daemon must be running on the node (the
            # hyperv-daemons package) or this directory is empty and the plugin
            # refuses to start rather than guessing at its own identity.
            - name: hyperv-kvp
              mountPath: /var/lib/hyperv
              readOnly: true
          resources:
            {{- toYaml .Values.node.resources | nindent 12 }}
          securityContext:
            # NodeStageVolume/NodeUnstageVolume actually mount and unmount
            # now (format included), which needs CAP_SYS_ADMIN, and is also
            # what Kubernetes requires to honor the kubelet-dir mount's
            # mountPropagation: Bidirectional above.
            privileged: true
      volumes:
        - name: socket-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins/{{ include "hyperv-csi.driverName" . }}
            type: DirectoryOrCreate
        - name: registration-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}/plugins_registry
            type: Directory
        - name: kubelet-dir
          hostPath:
            path: {{ .Values.node.kubeletDir }}
            type: Directory
        - name: device-dir
          hostPath:
            path: /dev
            type: Directory
        - name: hyperv-kvp
          hostPath:
            path: {{ .Values.node.kvpPoolDir }}
            # Directory, not DirectoryOrCreate: conjuring an empty one would
            # turn "integration services are not running" into a pod that starts
            # and then fails to find its VM ID, which is a longer path to the
            # same answer.
            type: Directory
      {{- with .Values.node.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.node.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

name: CI

on: [push]

permissions:
  contents: write
  packages: write

jobs:
  # Tags drive the version used for images, the chart, and the installer, so
  # every downstream job reads it from here rather than re-deriving it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-release: ${{ steps.v.outputs.is-release }}
      msi-version: ${{ steps.v.outputs.msi-version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            VERSION="0.0.0-dev-${GITHUB_SHA::8}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi
          # MSI/Burn ProductVersion is strictly major.minor.build (each
          # numeric, no prerelease suffix) - this repo's own tags don't fit
          # that as-is (e.g. v0.1.0-beta1), so strip anything from the first
          # "-" onward for the installer specifically. Two prereleases off
          # the same numeric core (0.1.0-beta1, 0.1.0-beta2) then map to the
          # same MSI version, which AllowSameVersionUpgrades="yes"
          # (Product.wxs) is exactly what's needed to still treat as an
          # upgrade rather than a second, unrelated product.
          echo "msi-version=${VERSION%%-*}" >> "$GITHUB_OUTPUT"

  go:
    name: Go test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: csi-driver/go.mod
          cache-dependency-path: csi-driver/go.sum
      - working-directory: csi-driver
        run: make test
      - working-directory: csi-driver
        run: make build

  dotnet:
    name: .NET test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('agent/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet test agent/HyperVCsiAgent.slnx -c Release

  docker:
    name: Container image
    needs: [version, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.version.outputs.is-release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: csi-driver
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.is-release == 'true' }}
          tags: |
            ghcr.io/charlespick/hyperv-csi-driver:${{ needs.version.outputs.version }}
            ghcr.io/charlespick/hyperv-csi-driver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Chart version is packaged from the tag rather than the value committed in
  # Chart.yaml, the same way the container image and installer take their
  # version from the tag rather than a hardcoded value.
  chart:
    name: Helm chart
    if: needs.version.outputs.is-release == 'true'
    needs: [version, go, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm package deploy/helm/hyperv-csi \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            -d dist
          helm push "dist/hyperv-csi-${{ needs.version.outputs.version }}.tgz" oci://ghcr.io/charlespick/charts

  # Only the bundle .exe is built (not the bare MSI) since it's the one thing
  # documented as the thing an operator downloads and runs - see README.md's
  # "Agent Installation".
  installer:
    name: Agent installer
    if: needs.version.outputs.is-release == 'true'
    needs: [version, dotnet]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('agent/**/*.csproj') }}
          restore-keys: nuget-
      - run: dotnet build agent/installer/HyperVCsiAgent.Installer.Bundle/HyperVCsiAgent.Installer.Bundle.wixproj -c Release -p:Platform=x64 -p:InstallerVersion=${{ needs.version.outputs.msi-version }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: agent/installer/HyperVCsiAgent.Installer.Bundle/bin/x64/Release/HyperVCsiAgent.Installer.Bundle.exe

  release:
    name: GitHub release
    if: needs.version.outputs.is-release == 'true'
    needs: [version, docker, chart, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - run: mv dist/HyperVCsiAgent.Installer.Bundle.exe "dist/hyperv-csi-agent-installer-${{ needs.version.outputs.version }}.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/hyperv-csi-agent-installer-*.exe
          generate_release_notes: true

name: CI

on: [push]

permissions:
  contents: write
  packages: write

jobs:
  # Tags drive the version used for images, the chart, and the installer, so
  # every downstream job reads it from here rather than re-deriving it.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      is-release: ${{ steps.v.outputs.is-release }}
    steps:
      - id: v
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  go:
    name: Go test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: csi-driver/go.mod
      - working-directory: csi-driver
        run: make test
      - working-directory: csi-driver
        run: make build

  dotnet:
    name: .NET test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test agent/HyperVCsiAgent.slnx -c Release

  docker:
    name: Container image
    needs: [version, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: needs.version.outputs.is-release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: csi-driver
          build-args: VERSION=${{ needs.version.outputs.version }}
          push: ${{ needs.version.outputs.is-release == 'true' }}
          tags: |
            ghcr.io/charlespick/hyperv-csi-driver:${{ needs.version.outputs.version }}
            ghcr.io/charlespick/hyperv-csi-driver:latest

  # Chart version is packaged from the tag rather than the value committed in
  # Chart.yaml, the same way the container image and installer take their
  # version from the tag rather than a hardcoded value.
  chart:
    name: Helm chart
    if: needs.version.outputs.is-release == 'true'
    needs: [version, go, dotnet]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm registry login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - run: |
          helm package deploy/helm/hyperv-csi \
            --version "${{ needs.version.outputs.version }}" \
            --app-version "${{ needs.version.outputs.version }}" \
            -d dist
          helm push "dist/hyperv-csi-${{ needs.version.outputs.version }}.tgz" oci://ghcr.io/charlespick/charts

  # Only the bundle .exe is built (not the bare MSI) since it's the one thing
  # documented as the thing an operator downloads and runs - see README.md's
  # "Agent Installation".
  installer:
    name: Agent installer
    if: needs.version.outputs.is-release == 'true'
    needs: [version, dotnet]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build agent/installer/HyperVCsiAgent.Installer.Bundle/HyperVCsiAgent.Installer.Bundle.wixproj -c Release -p:Platform=x64
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: agent/installer/HyperVCsiAgent.Installer.Bundle/bin/x64/Release/HyperVCsiAgent.Installer.Bundle.exe

  release:
    name: GitHub release
    if: needs.version.outputs.is-release == 'true'
    needs: [version, docker, chart, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: installer
          path: dist
      - run: mv dist/HyperVCsiAgent.Installer.Bundle.exe "dist/hyperv-csi-agent-installer-${{ needs.version.outputs.version }}.exe"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/hyperv-csi-agent-installer-*.exe
          generate_release_notes: true

# Driver definition for the upstream Kubernetes external storage test suite
# (test/e2e/storage/external in kubernetes/kubernetes). The fields here are
# storageframework.DriverInfo; the suite reads them to decide which of its test
# patterns and test suites apply to this driver, so a capability set to true
# that the driver cannot actually honor shows up as a test failure, and one left
# false silently removes that test's coverage.
#
# Every false below is a documented silence. testing.md carries the full table
# with the reason for each; keep the two in sync.

StorageClass:
  # Resolved relative to --repo-root, which the runner scripts point at the
  # root of this repository.
  FromFile: test/e2e/storageclass.yaml

# Required for the snapshot tests, and not implied by the snapshotDataSource
# capability below: GetSnapshotClass skips every snapshot test outright unless
# one of FromName, FromFile or FromExistingClassName is set here, so flipping
# the capability without this would silently change nothing.
#
# FromName, rather than a file of our own or the chart's class: it has the
# framework generate a VolumeSnapshotClass named after the driver with empty
# parameters and deletionPolicy Delete, created and deleted per test the same
# way it copies the StorageClass above. Nothing here depends on the chart
# having created its own class, and nothing outlives the run. CreateSnapshot
# ignores snapshot class parameters anyway, so there is nothing to put in a
# file.
#
# The cluster still needs the snapshot.storage.k8s.io CRDs and the
# snapshot-controller installed, and the chart's own external-snapshotter
# sidecar enabled (controller.snapshotter.enabled), or every snapshot test
# fails rather than skips.
SnapshotClass:
  FromName: true

DriverInfo:
  # Must match DriverName in csi-driver/internal/driver/driver.go and the
  # provisioner of storageclass.yaml. It is also what the focus regex in the
  # runner scripts matches on, since it appears in every test name as
  # "[Driver: csi.hyper-v.makerland.xyz]".
  Name: csi.hyper-v.makerland.xyz

  # 1Gi is CreateVolume's own default size and the smallest thing worth asking
  # a Hyper-V host for. The framework uses Min as the claim size for most
  # tests, so this is the size the run provisions over and over — keeping it
  # small keeps the run short.
  SupportedSizeRange:
    Min: 1Gi
    Max: 64Gi

  # "" is the default-filesystem pattern, which exercises NodeStageVolume's own
  # defaultFsType fallback; ext4 is the only filesystem the node image can
  # actually create, since only e2fsprogs is installed. Adding xfs here without
  # adding xfsprogs to the node image would only prove that mkfs.xfs is missing.
  SupportedFsType:
    "": {}
    ext4: {}

  # Largest file the volume I/O suite writes and reads back. 100 MiB
  # (storageframework.FileSizeMedium) is the usual choice for a CSI driver.
  # Drop it to 1048576 (FileSizeSmall) if the CSV makes this the slowest part
  # of the run.
  MaxFileSize: 104857600

  Capabilities:
    # --- Supported, and exercised ---------------------------------------
    persistence: true          # data survives pod restarts
    exec: true                 # a binary in the volume can be executed
    fsGroup: true              # CSIDriver sets fsGroupPolicy: File
    multipods: true            # two pods on one node share a staged volume
    controllerExpansion: true  # ControllerExpandVolume grows the VHDX
    nodeExpansion: true        # NodeExpandVolume grows the filesystem
    onlineExpansion: true      # both were verified against a running VM
    offlineExpansion: true
    readWriteOncePod: true     # SINGLE_NODE_SINGLE_WRITER is accepted

    # --- Supported, and this suite is the first exercise ----------------
    # Implemented but never yet run against a real Hyper-V cluster, unlike
    # everything above. Turning them on is deliberate: an unexercised RPC is
    # exactly what a test run is for, and leaving them false would hide the
    # snapshot path from the only thing that can tell us it works. Expect the
    # first run with these on to be where snapshot failures surface.
    #
    snapshotDataSource: true   # CreateSnapshot, DeleteSnapshot, ListSnapshots

    # --- Not supported: the driver rejects these outright ---------------
    block: false               # requireMountVolume rejects block volumes
    RWX: false                 # a VHDX attaches to one VM at a time
    capReadOnlyMany: false     # ROX maps to MULTI_NODE_READER_ONLY, rejected
    groupSnapshot: false        # no GET_VOLUME_GROUP_SNAPSHOT capability
    # PVC-to-PVC cloning, which is a different capability from restoring a
    # snapshot: it needs CLONE_VOLUME in ControllerGetCapabilities and a
    # CreateVolume that accepts a *volume* as its content source. Only the
    # snapshot content source is being built, so this stays off - turning it
    # on would fail the clone tests rather than skip them.
    pvcDataSource: false
    topology: false            # NodeGetInfo reports no accessible topology
    capacity: false            # GetCapacity is not implemented
    volumeLimits: false        # NodeGetInfo reports no max_volumes_per_node
    volumeMountGroup: false    # no VOLUME_MOUNT_GROUP node capability
    seLinuxMount: false        # no SELinux mount option support

    # --- Supported in principle, silenced for the first run -------------
    # Two PVs sharing one volume handle. findAttachedNode matches a
    # VolumeAttachment by PV name and relies on PV name == volume handle, so a
    # second PV with the same handle can resolve expansion to the wrong node.
    # A real driver-side limitation, not a test-harness one.
    multiplePVsSameID: false

  # singleNodeVolume is deliberately absent (false): a VHDX is not node-local
  # storage. Leaving it false is what lets the multi-volume suite run the
  # "different node" cases, which are a detach-then-attach cycle driven by the
  # attach/detach controller — the single most valuable thing in this run.

# Every timeout the framework applies, in the few places a Hyper-V round trip is
# slower than the cloud providers these defaults were tuned for. Raising a
# timeout is always preferable to skipping a test: a slow pass is still a pass,
# and a skip is coverage lost. Keys must match fields of
# framework.TimeoutContext exactly or the suite refuses to start.
Timeouts:
  # Default 5m. Covers attach + NodeStageVolume's mkfs + mount.
  PodStart: 10m
  # Default 15m, used by the tests that already expect to wait.
  PodStartSlow: 20m
  # Default 5m. CreateVolume against the agent, through the job queue.
  ClaimProvision: 10m
  # Default 5m. Detach has to resolve cluster ownership before it can run.
  PodDelete: 10m
  # Default 5m. DeleteVolume, after external-attacher has cleared the
  # VolumeAttachment.
  PVDelete: 10m
